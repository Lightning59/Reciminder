<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        {% load static %}
        <link rel="stylesheet" href="{% static 'styles/main.css' %}">
        <title>Reciminder</title>
    </head>
    <body>
        <header>
            <a href="{% url 'index' %}" class="brand">Reciminder</a>
            <nav class="nav">
                <a href="#">Recipes</a>
                {% if request.user.is_authenticated %}
                <a href="{% url 'logout' %}">Logout</a>
                {% else %}
                    <a href="#">Login</a>
                {% endif %}
            </nav>
        </header>
        <main>
            {% block content %}
            {% endblock %}
        </main>
        <div class="footer-protector"></div>
        <footer>
            <p>Copyright &copy; Reciminder 2025</p>
        </footer>
    </body>
</html>
